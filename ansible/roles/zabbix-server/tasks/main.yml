---
- name: Install Docker
  ansible.builtin.include_role:
    name: docker-compose

- name: Create Zabbix directory
  ansible.builtin.file:
    path: "{{ zabbix_project_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create Zabbix compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ zabbix_project_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Pull Zabbix images
  ansible.builtin.command:
    cmd: docker compose pull
    chdir: "{{ zabbix_project_dir }}"
  changed_when: false

- name: Start Zabbix stack
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ zabbix_project_dir }}"

- name: Show Zabbix containers
  ansible.builtin.command:
    cmd: docker compose ps
    chdir: "{{ zabbix_project_dir }}"
  register: zabbix_compose_status
  changed_when: false

- name: Display Zabbix containers
  ansible.builtin.debug:
    var: zabbix_compose_status.stdout_lines