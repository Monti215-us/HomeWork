---
- name: Download Zabbix repository
  ansible.builtin.get_url:
    url: https://repo.zabbix.com/zabbix/7.0/ubuntu/pool/main/z/zabbix-release/zabbix-release_latest_7.0+ubuntu22.04_all.deb
    dest: /tmp/zabbix-release.deb

- name: Install Zabbix repository
  ansible.builtin.apt:
    deb: /tmp/zabbix-release.deb
    update_cache: true

- name: Install PostgreSQL and components
  ansible.builtin.apt:
    name:
      - postgresql
      - acl # Необходим для работы become_user: postgres в Ansible
    state: present

- name: Install Zabbix Server
  ansible.builtin.apt:
    name:
      - zabbix-server-pgsql
      - zabbix-sql-scripts
    state: present
    update_cache: true

- name: Start PostgreSQL
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true

- name: Create Zabbix database user
  become_user: postgres
  ansible.builtin.shell:
    cmd: |
      psql -tc "SELECT 1 FROM pg_roles WHERE rolname = 'zabbix'" | grep -q 1 ||
      psql -c "CREATE USER zabbix WITH PASSWORD 'zabbix';"
  args:
    executable: /bin/bash
  changed_when: false

- name: Create Zabbix database with correct owner
  become_user: postgres
  ansible.builtin.shell:
    cmd: |
      psql -tc "SELECT 1 FROM pg_database WHERE datname = 'zabbix'" | grep -q 1 ||
      createdb -O zabbix zabbix
  args:
    executable: /bin/bash
  changed_when: false

# Перед импортом схемы проверяем, пустая ли база (ищем таблицу users)
- name: Check if Zabbix schema is already imported
  become_user: postgres
  ansible.builtin.command:
    cmd: psql -d zabbix -tc "SELECT 1 FROM pg_tables WHERE tablename = 'users';"
  register: zabbix_schema_check
  changed_when: false

- name: Import Zabbix database schema
  ansible.builtin.shell:
    cmd: "zcat /usr/share/zabbix-sql-scripts/postgresql/server.sql.gz | psql -h 127.0.0.1 -U zabbix -d zabbix"
  environment:
    PGPASSWORD: 'zabbix'
  when: "'1' not in zabbix_schema_check.stdout"

- name: Configure Zabbix Server database
  ansible.builtin.lineinfile:
    path: /etc/zabbix/zabbix_server.conf
    regexp: '^#?{{ item.key }}='
    line: '{{ item.key }}={{ item.value }}'
  loop:
    - { key: 'DBName', value: 'zabbix' }
    - { key: 'DBUser', value: 'zabbix' }
    - { key: 'DBPassword', value: 'zabbix' }
  notify: Restart Zabbix Server

- name: Install Zabbix Web UI
  ansible.builtin.apt:
    name:
      - zabbix-frontend-php
      - zabbix-nginx-conf
    state: present
    update_cache: true

- name: Start Zabbix Server
  ansible.builtin.service:
    name: zabbix-server
    state: started
    enabled: true

