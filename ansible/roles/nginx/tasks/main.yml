---
    - name: Установка nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
    
    - name: Копирование сайта на хост
      ansible.builtin.copy:
        src: index.html
        dest: /var/www/html/
    # копирует страницу с сайтом на управляемый узел в указанную директорию    
    # из директории ../files/ в /var/www/html/
    - name: Запуск Nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true