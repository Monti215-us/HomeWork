    - name: Обновление кэша APT
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Установка зависимостей для добавления репозиториев
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present

    - name: Создание директории для GPG-ключей Docker
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Добавление официального GPG-ключа Docker
      ansible.builtin.shell: >
        curl -fsSL https://docker.com | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
        creates=/etc/apt/keyrings/docker.gpg

    - name: Добавление репозитория Docker в источники APT
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://docker.com {{ ansible_distribution_release }} stable"
        state: present

    - name: Установка Docker, CLI и плагина Docker Compose
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Запуск и включение службы Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: yes